name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build srep (Linux x86-64)
      run: bash build/build.sh linux
    - name: Test (without wine, 32-bit or the race probe)
      run: bash tests/run.sh quick
